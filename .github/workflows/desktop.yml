name: desktop

# Builds, tests and packages ThixCalendar for Windows and macOS on every branch, versioned by branch:
#   main  -> release : <major>.<minor>.<run number>-<date>   e.g. 0.1.42-20261115
#   dev   -> nightly : nightly-<run number>-<date>          e.g. nightly-43-20261115
#   other -> local   : local-<date>                          (feature branches, pull requests)
# The run number grows with every build of this workflow and is the build number the update check compares.
#
# Packages:
#   Windows : ThixCalendarSetup.exe (the program is its own setup: install, update, uninstall)
#   macOS   : ThixCalendar-macOS-<arm64|x64>.dmg (first installation) and .zip (update of installed versions)
#   every build      : workflow artifact "ThixCalendar-<version>" (all packages + update manifest)
#   main (push)      : rolling release "release-channel" (OTA feed of release builds) + versioned release "v<version>"
#   dev  (push)      : rolling pre-release "nightly-channel" (OTA feed of nightly builds)
#
# App registrations (docs/APP-REGISTRIERUNG.md): the Microsoft client id is built in (Directory.Build.props). Optional
# repository secrets THIXCALENDAR_GOOGLE_CLIENT_ID, THIXCALENDAR_GOOGLE_CLIENT_SECRET (and THIXCALENDAR_MICROSOFT_CLIENT_ID
# to override) are read by MSBuild as properties from the environment. Users never enter a client id.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

# One run per branch at a time: two quick pushes must not upload to the same release channel at once (queued, not cancelled).
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Read by MSBuild as properties (Directory.Build.props); empty = the defaults there (Microsoft and the Google client id are
  # built in; the Google client secret comes only from THIXCALENDAR_GOOGLE_CLIENT_SECRET - GitHub push protection blocks it in git).
  MicrosoftClientId: ${{ secrets.THIXCALENDAR_MICROSOFT_CLIENT_ID }}
  GoogleClientId: ${{ secrets.THIXCALENDAR_GOOGLE_CLIENT_ID }}
  GoogleClientSecret: ${{ secrets.THIXCALENDAR_GOOGLE_CLIENT_SECRET }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ver.outputs.channel }}
      date: ${{ steps.ver.outputs.date }}
      build: ${{ steps.ver.outputs.build }}
      version: ${{ steps.ver.outputs.version }}
      props: ${{ steps.ver.outputs.props }}
    steps:
      - uses: actions/checkout@v4

      # One version for every platform of this run (the jobs may run across midnight).
      - name: Determine version metadata
        id: ver
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main) channel=release ;;
            dev)  channel=nightly ;;
            *)    channel=local ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then channel=local; fi
          date=$(date -u +%Y%m%d)
          build=${GITHUB_RUN_NUMBER}
          major=$(sed -n 's:.*<ThixCalendarMajor>\(.*\)</ThixCalendarMajor>.*:\1:p' Directory.Build.props)
          minor=$(sed -n 's:.*<ThixCalendarMinor>\(.*\)</ThixCalendarMinor>.*:\1:p' Directory.Build.props)
          case "$channel" in
            release) version="${major}.${minor}.${build}-${date}" ;;
            nightly) version="nightly-${build}-${date}" ;;
            *)       version="local-${date}" ;;
          esac
          {
            echo "channel=$channel"
            echo "date=$date"
            echo "build=$build"
            echo "version=$version"
            echo "props=-p:Channel=$channel -p:BuildNumber=$build -p:BuildDate=$date"
          } >> "$GITHUB_OUTPUT"
          printf '### ThixCalendar\n\n- version: `%s`\n- channel: `%s`\n' "$version" "$channel" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/ThixCalendar.Tests/ThixCalendar.Tests.csproj

      - name: Build
        run: dotnet build tests/ThixCalendar.Tests/ThixCalendar.Tests.csproj -c Release --no-restore ${{ needs.version.outputs.props }}

      # Business layer (reminders, events, accounts), sync against fake Microsoft Graph / Google / ICS, the OAuth
      # loopback and the UI rendered headless (screenshots of every page as an artifact).
      - name: Test
        run: dotnet test tests/ThixCalendar.Tests/ThixCalendar.Tests.csproj -c Release --no-build --logger GitHubActions
        env:
          THIXCALENDAR_SCREENSHOTS: ${{ github.workspace }}/screenshots

      - name: Publish (win-x64, self-contained single file)
        run: dotnet publish src/ThixCalendar/ThixCalendar.csproj -c Release -r win-x64 -o publish ${{ needs.version.outputs.props }}

      # The published program is trimmed: it checks itself (SelfTest.cs) – JSON, SQLite, Ical.Net, provider JSON, SkiaSharp,
      # the token store, the sound, shortcuts (COM) and every window – before anybody downloads it.
      - name: Self test of the published program
        shell: pwsh
        timeout-minutes: 5
        run: |
          $process = Start-Process -FilePath publish\ThixCalendar.exe -ArgumentList '--self-test', "$PWD\self-test.txt" -Wait -PassThru
          if (Test-Path self-test.txt) { Get-Content self-test.txt } else { Write-Host 'no report written' }
          if ($process.ExitCode -ne 0) { throw "self test failed (exit code $($process.ExitCode))" }

      # ThixCalendar.exe is its own setup (InstallService): started from the download it installs itself per user,
      # "--update" is the silent update, "--uninstall" the uninstaller. No installer tool needed.
      - name: Package setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item publish\ThixCalendar.exe artifacts\ThixCalendarSetup.exe
          Get-Item artifacts\ThixCalendarSetup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/
          retention-days: 2

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/ThixCalendar.Tests/ThixCalendar.Tests.csproj

      - name: Build
        run: dotnet build tests/ThixCalendar.Tests/ThixCalendar.Tests.csproj -c Release --no-restore ${{ needs.version.outputs.props }}

      # The same tests as on Windows, here on macOS (Keychain, LaunchAgent, menu bar).
      - name: Test
        run: dotnet test tests/ThixCalendar.Tests/ThixCalendar.Tests.csproj -c Release --no-build --logger GitHubActions
        env:
          THIXCALENDAR_SCREENSHOTS: ${{ github.workspace }}/screenshots

      - name: Publish and package (arm64 and x64)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package-macos.sh
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/ThixCalendar/ThixCalendar.csproj -c Release -r "$rid" -o "publish/$rid" ${{ needs.version.outputs.props }}
            scripts/package-macos.sh "publish/$rid" "$rid" "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.build }}" artifacts
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/
          retention-days: 2

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      # installer.json: the install options (SETUP-08) go into the manifest as "installer" (ThixLauncher, ThixInstall)
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: src/ThixCalendar.Core/installer.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts

      # The manifest the installed application reads for its update check (UpdateService): "setup"/"sha256" for
      # Windows, "packages" for each platform, "installer" = what the setup offers (installer.json, SETUP-08).
      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          cat > thixcalendar-update.json <<JSON
          {
            "version": "${{ needs.version.outputs.version }}",
            "channel": "${{ needs.version.outputs.channel }}",
            "buildNumber": ${{ needs.version.outputs.build }},
            "setup": "ThixCalendarSetup.exe",
            "sha256": "$(sha ThixCalendarSetup.exe)",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "installer": $(cat ../source/src/ThixCalendar.Core/installer.json),
            "packages": {
              "win-x64": { "file": "ThixCalendarSetup.exe", "sha256": "$(sha ThixCalendarSetup.exe)" },
              "osx-arm64": { "file": "ThixCalendar-macOS-arm64.zip", "sha256": "$(sha ThixCalendar-macOS-arm64.zip)" },
              "osx-x64": { "file": "ThixCalendar-macOS-x64.zip", "sha256": "$(sha ThixCalendar-macOS-x64.zip)" }
            }
          }
          JSON
          cat thixcalendar-update.json
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ThixCalendar-${{ needs.version.outputs.version }}
          path: artifacts/
          retention-days: 30

      # One rolling release per channel; each build replaces its files. The packages go up BEFORE the manifest,
      # so an installation never reads a manifest whose package is not there yet.
      - name: Publish to the update channel
        if: github.event_name == 'push' && needs.version.outputs.channel != 'local'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          channel="${{ needs.version.outputs.channel }}"
          version="${{ needs.version.outputs.version }}"
          tag="${channel}-channel"
          if [ "$channel" = "release" ]; then prerelease=""; title="ThixCalendar (Release-Kanal)"; else prerelease="--prerelease"; title="ThixCalendar (Nightly-Kanal)"; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" $prerelease \
              --notes "Neuester Build des Kanals ${channel}. Windows: ThixCalendarSetup.exe installiert oder aktualisiert ThixCalendar. macOS: ThixCalendar-macOS-arm64.dmg (Apple Silicon) bzw. -x64.dmg (Intel) öffnen und ThixCalendar in „Programme“ ziehen. Installierte Versionen aktualisieren sich von hier aus selbst."
          fi
          gh release upload "$tag" artifacts/ThixCalendarSetup.exe artifacts/ThixCalendar-macOS-*.zip artifacts/ThixCalendar-macOS-*.dmg --clobber
          gh release upload "$tag" artifacts/thixcalendar-update.json --clobber
          gh release edit "$tag" --title "$title – $version"
          echo "Published $version to $tag"

      - name: Versioned release
        if: github.event_name == 'push' && needs.version.outputs.channel == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          cd artifacts
          cp ThixCalendarSetup.exe "ThixCalendarSetup-${version}.exe"
          for arch in arm64 x64; do cp "ThixCalendar-macOS-${arch}.dmg" "ThixCalendar-${version}-macOS-${arch}.dmg"; done
          gh release create "v${version}" --target "$GITHUB_SHA" --title "ThixCalendar ${version}" --generate-notes \
            "ThixCalendarSetup-${version}.exe" "ThixCalendar-${version}-macOS-arm64.dmg" "ThixCalendar-${version}-macOS-x64.dmg"
